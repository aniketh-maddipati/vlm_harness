# Lumina design tokens — Contract v6 (+ Amendment Batch 1; Batch 2 distribution)
# Generates Swift constants (HiFiTokens / LuminaTokens). Every value cites law.
# Schema: section → token → { value, unit?, type, cite, notes? }
# Types: color | pt | px | ms | opacity | animation | enum | bool | string
# Authority: design/contract-v6.md → this file → code → tests.
# Magic numbers in UI code are banned; consume these tokens only.
# Change-marks: tokens with cite containing A1–A10 are Batch 1; see grammar.* and color.swimlane_fill_opacity.
# [● A1] mvp_test_floor · [● A2] crop_* · [● A3] pointer_cull_* · [● A4] clipping_hold_key / clipping_grammar
# [● A6] swimlane_fill_opacity socket · [● A7 — withdrawn A13, Batch 2] beta_testflight_crash_reporting · [● A8] beta_licensing


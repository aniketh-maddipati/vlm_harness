name: Rendering gates

# Lean merge path: fast + compile-logic on every matching PR/push.
# Heavy Mac jobs (build-stability, render-live) run on main / schedule / dispatch only.
# No new harness lanes or frameworks — workflow conditions only.

on:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "Lumina/**"
      - "Lumina.xcodeproj/**"
      - "LuminaLogicTests/**"
      - "LuminaUITests/**"
      - "DesignTokens/**"
      - "Scripts/harness/**"
      - "Scripts/build_stability.sh"
      - "Scripts/compile_check.sh"
      - "Scripts/regression.sh"
      - "Scripts/fixtures/**"
      - "TestPlans/**"
      - "design/contract-v6.md"
      - "design/copy-contract.txt"
      - "design/fixture-manifest.*"
      - "design/tokens.yaml"
      - "AGENTS.md"
      - "HARNESS.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Lumina/**"
      - "Lumina.xcodeproj/**"
      - "LuminaLogicTests/**"
      - "LuminaUITests/**"
      - "DesignTokens/**"
      - "Scripts/harness/**"
      - "Scripts/build_stability.sh"
      - "Scripts/compile_check.sh"
      - "Scripts/regression.sh"
      - "Scripts/fixtures/**"
      - "TestPlans/**"
      - "design/contract-v6.md"
      - "design/copy-contract.txt"
      - "design/fixture-manifest.*"
      - "design/tokens.yaml"
      - "AGENTS.md"
      - "HARNESS.md"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      lane:
        description: Rendering lane to run
        required: true
        default: correctness
        type: choice
        options:
          - correctness
          - nightly
          - all
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: read

concurrency:
  group: rendering-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.lane != 'nightly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/harness/run.py fast

  compile-logic:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.lane != 'nightly')
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore DerivedData
        uses: actions/cache@v4
        with:
          path: DD
          key: compile-logic-${{ runner.os }}-${{ hashFiles('Lumina.xcodeproj/project.pbxproj', 'Scripts/harness/lint/xcode_compile.py') }}
          restore-keys: |
            compile-logic-${{ runner.os }}-
      - name: Build app and tests
        run: |
          python3 Scripts/harness/release/write_build_manifest.py
          python3 Scripts/harness/lint/xcode_compile.py \
            --project-root . --derived-data DD
      - name: Logic tests
        run: |
          xcodebuild -project Lumina.xcodeproj -scheme Lumina \
            -configuration Debug -derivedDataPath DD \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:LuminaLogicTests test-without-building
      - name: Preserve compile evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logic
          path: |
            artifacts/harness/runs/
            Lumina/Resources/LuminaBuildManifest.json
            DD/Build/Products/Debug/Lumina.app/Contents/Resources/LuminaBuildManifest.json
          if-no-files-found: warn

  # Two clean rounds (~10–15 min). Not on the PR critical path — main / nightly / dispatch only.
  # No needs:[fast] — the script already runs FAST each round; schedule would skip if fast were required.
  build-stability:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.lane != 'correctness')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install harness YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/lumina-build-venv"
          "$RUNNER_TEMP/lumina-build-venv/bin/python" -m pip install --disable-pip-version-check pyyaml
          echo "$RUNNER_TEMP/lumina-build-venv/bin" >> "$GITHUB_PATH"
      - name: Run two clean build-stability rounds
        run: bash Scripts/build_stability.sh
      - name: Preserve build-stability evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-stability
          path: artifacts/harness/runs/build-stability/
          if-no-files-found: warn

  # GitHub forbids `secrets` in job-level `if`. Probe them on Ubuntu, then
  # start macos-15 only when both hosted fixture secrets exist.
  # Hosted live render stays off the PR path (main / correctness dispatch only).
  render-live-gate:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane != 'nightly')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_URL }}
          SHA: ${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_SHA256 }}
        run: |
          if [ -n "$URL" ] && [ -n "$SHA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Hosted RAW fixture secrets unset; render-live skipped (BLOCKED, not a pass)."
          fi

  render-live:
    if: >
      needs.render-live-gate.outputs.enabled == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane != 'nightly'))
    needs: [compile-logic, render-live-gate]
    runs-on: macos-15
    timeout-minutes: 25
    # Job-level env cannot use runner.* (GitHub rejects the workflow). Paths use $RUNNER_TEMP.
    env:
      LUMINA_RAW_FIXTURE_BUNDLE_URL: ${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_URL }}
      LUMINA_RAW_FIXTURE_BUNDLE_SHA256: ${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Export fixture paths
        run: |
          echo "LUMINA_RAW_FIXTURE_ROOT=${RUNNER_TEMP}/raw-correctness-v1" >> "$GITHUB_ENV"
          echo "LUMINA_RAW_FIXTURE_ARCHIVE=${RUNNER_TEMP}/raw-correctness-v1-archive/bundle" >> "$GITHUB_ENV"
      - name: Restore DerivedData
        uses: actions/cache@v4
        with:
          path: DD
          key: compile-logic-${{ runner.os }}-${{ hashFiles('Lumina.xcodeproj/project.pbxproj', 'Scripts/harness/lint/xcode_compile.py') }}
          restore-keys: |
            compile-logic-${{ runner.os }}-
      - name: Restore hosted RAW archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/raw-correctness-v1-archive
          key: raw-correctness-v1-${{ env.LUMINA_RAW_FIXTURE_BUNDLE_SHA256 }}
      - name: Install harness YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/lumina-venv"
          "$RUNNER_TEMP/lumina-venv/bin/python" -m pip install --disable-pip-version-check pyyaml
          echo "$RUNNER_TEMP/lumina-venv/bin" >> "$GITHUB_PATH"
      - name: Verify hosted RAW fixtures
        run: |
          python3 Scripts/fixtures/verify_raw_fixture_bundle.py \
            --root "$LUMINA_RAW_FIXTURE_ROOT" --tier hosted --fetch \
            --archive "$LUMINA_RAW_FIXTURE_ARCHIVE"
      - name: Live render correctness
        run: |
          python3 Scripts/harness/develop/run_live_raw_render.py \
            --project-root . --derived-data DD --fixture-tier hosted
          python3 Scripts/harness/develop/run_live_progressive_focus.py \
            --project-root . --derived-data DD --fixture-tier hosted
      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-live
          path: |
            artifacts/harness/runs/
            artifacts/harness/ledgers/render-*.json
          if-no-files-found: warn

  render-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lane != 'correctness')
    runs-on: [self-hosted, macOS, ARM64, lumina-render]
    timeout-minutes: 60
    env:
      LUMINA_RAW_FIXTURE_ROOT: ${{ vars.LUMINA_RAW_FIXTURE_ROOT }}
      LUMINA_RAW_FIXTURE_BUNDLE_URL: ${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_URL }}
      LUMINA_RAW_FIXTURE_BUNDLE_SHA256: ${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_SHA256 }}
      LUMINA_RENDER_BASELINE: ${{ vars.LUMINA_RENDER_BASELINE }}
      LUMINA_RENDER_STATE_PATH: ${{ vars.LUMINA_RENDER_STATE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Export fixture archive path
        run: |
          echo "LUMINA_RAW_FIXTURE_ARCHIVE=${RUNNER_TEMP}/raw-correctness-v1-archive/bundle" >> "$GITHUB_ENV"
      - name: Restore full RAW archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/raw-correctness-v1-archive
          key: raw-correctness-v1-${{ secrets.LUMINA_RAW_FIXTURE_BUNDLE_SHA256 }}
      - name: Install harness YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/lumina-venv"
          "$RUNNER_TEMP/lumina-venv/bin/python" -m pip install --disable-pip-version-check pyyaml
          echo "$RUNNER_TEMP/lumina-venv/bin" >> "$GITHUB_PATH"
      - name: Verify full RAW fixture fleet
        run: |
          python3 Scripts/fixtures/verify_raw_fixture_bundle.py \
            --root "$LUMINA_RAW_FIXTURE_ROOT" --tier full --fetch \
            --archive "$LUMINA_RAW_FIXTURE_ARCHIVE"
      - name: Fixed-hardware rendering stress
        run: python3 Scripts/harness/develop/run_nightly_render.py
      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-nightly
          path: |
            artifacts/harness/runs/
            artifacts/harness/ledgers/render-*.json
          if-no-files-found: warn

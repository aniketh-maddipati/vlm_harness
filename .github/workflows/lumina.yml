name: Lumina

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request runs the fast set: three Linux jobs and two macOS jobs (build + tests with the
# release preflight; the probe's smoke, screens and sandbox smoke). The long probe storms (fuzz,
# scroll, edit, RAW 9) run on main and on demand (Actions > Lumina > Run workflow, any branch).
# Seven macOS jobs per PR filled the account's macOS runners on their own, so PRs queued.

# A newer run on the same branch or PR replaces the older one (the macOS runners queue up
# otherwise: several sessions pushing in a row turned a 5-minute run into 17). Runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  design:
    name: design handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: lumina-core fixtures
        run: |
          source Scripts/page_files.sh
          cd design/handoff/lumina-cull && node "$CORE_TEST" | tee /tmp/fixtures.txt && ! grep -q '^FAIL' /tmp/fixtures.txt
      - name: culling eval scoring (synthetic data) + the readOne guard
        run: node --test Tools/culleval/tests/culleval.test.mjs
      - name: app ships the design byte for byte
        run: |
          set -e
          source Scripts/page_files.sh
          for f in "${PAGE_FILES[@]}"; do
            cmp "design/handoff/lumina-cull/$f" "Lumina/Sets/Web/$f"
          done
          for f in design/handoff/vendor/*.js; do cmp "$f" "Lumina/Sets/Web/$(basename "$f")"; done
      - name: wording + demo-layer audit (report only)
        run: source Scripts/page_files.sh && python3 Tests/probe/design_audit.py "design/handoff/lumina-cull/$PAGE"

      - name: parity tools (ΔE, numpy mirror, refs, report)
        run: python3 -m pip install -q -r Tools/parity/requirements.txt && make parity-test
      - name: rules-v1.json is valid JSON in canonical stage order
        run: python3 -c "import json;r=json.load(open('Lumina/Sets/Look/rules-v1.json'));assert r['order'][0]=='rawDevelop' and r['order'][-1]=='outputTransform';print(len(r['stages']),'stages')"

  webkit:
    name: page + plumbing in WebKit (WebKitGTK sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # The Ubuntu mirror stalls now and then (a run on 2026-10-01 fetched at 130 kB/s and took ten
      # minutes; another hung). Stalled downloads time out and retry, and the packages are cached, so
      # most runs don't download them at all. Both apt installs of the job use the same settings.
      - name: "apt: retries, timeouts, a package cache"
        run: |
          # Owned by the runner: actions/cache restores as that user and tar must be able to set the
          # directory's times and mode (a root-owned directory made the restore fail with exit code 2).
          sudo mkdir -p /var/cache/lumina-apt/partial && sudo chown -R "$(id -u):$(id -g)" /var/cache/lumina-apt && chmod -R 777 /var/cache/lumina-apt
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            'APT::Keep-Downloaded-Packages "true";' 'Dir::Cache::Archives "/var/cache/lumina-apt";' | sudo tee /etc/apt/apt.conf.d/80-lumina-ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/lumina-apt
          key: apt-webkit-${{ runner.os }}-${{ hashFiles('.github/workflows/lumina.yml') }}
          restore-keys: apt-webkit-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}-chromium
      - name: WebKitGTK, Xvfb, playwright (fixture JPEGs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gir1.2-webkit2-4.1 python3-gi python3-gi-cairo xvfb
          npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: "apt: leave the cache readable"
        if: always()
        run: sudo rm -f /var/cache/lumina-apt/lock; sudo chown -R "$(id -u):$(id -g)" /var/cache/lumina-apt; chmod -R a+rwX /var/cache/lumina-apt
      - name: plumbing harness (Chromium)
        run: NODE_PATH="$(npm root -g)" node Tests/web/plumbing-harness.mjs
      - name: contract, selftest, app flow, screens (prototype vs app)
        run: NODE_PATH="$(npm root -g)" xvfb-run -a -s "-screen 0 2000x1300x24" /usr/bin/python3 Tests/web/webkit.py

  swift-linux:
    name: native file code on Linux (Swift 6.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SetsSidecarTests, SetsTrustTests, SetsFileOpsTests, LookStringTests, LookMathTests, LookCanvasTests
        run: bash Tests/linux-swift/run.sh

  app:
    # Then what ships (TASKS R3): the Release archive with Config/Release.xcconfig, sandboxed,
    # hardened, signed ad hoc, and the preflight in strict mode. Strict fails on any WARN except the
    # items still open in docs/release/TASKS.md, allowed by tag: D2 (network.client while the UI is
    # the WebView: stands until the decision). When one lands, its tag comes off PREFLIGHT_ALLOW.
    name: build + tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build and test
        run: |
          xcodebuild -project Lumina.xcodeproj -scheme Lumina -configuration Debug \
            -derivedDataPath DD -destination 'platform=macOS,arch=arm64' \
            -only-testing:LuminaLogicTests test
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Tools/parity/lumina-render/.build
          key: lumina-render-${{ runner.os }}-${{ hashFiles('Tools/parity/lumina-render/Package.swift', 'Tools/parity/lumina-render/Sources/**/*.swift', 'Lumina/Sets/Look/*.swift') }}
      - name: lumina-render builds and its graph matches LookMath and the numpy mirror
        run: |
          swift build -c release --package-path Tools/parity/lumina-render
          Tools/parity/lumina-render/.build/release/lumina-render ramp --out "${{ runner.temp }}/ramp.json"
          python3 -m venv "${{ runner.temp }}/venv" && "${{ runner.temp }}/venv/bin/pip" install -q -r Tools/parity/requirements.txt
          "${{ runner.temp }}/venv/bin/python" Tools/parity/lookmath.py --check "${{ runner.temp }}/ramp.json"
      - name: release.sh local --strict
        env:
          PREFLIGHT_ALLOW: D2
        run: bash Scripts/release.sh local --strict

  probe:
    # Job and shard names stay as they were, so required checks keep matching. One shard on a pull
    # request: `smoke` (contract + selftest + the app flow), `screens` (every
    # screen once, the app twins compared with the prototype in the same run; the committed
    # reference is for local runs) and smoke inside the App Sandbox with the shipped entitlements
    # (R1a, R3). On main and on demand, the long shards run alongside it in parallel; each builds
    # the probe once (cached).
    name: probe (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["smoke + screens"]' || '["smoke + screens", "fuzz 1-2", "fuzz 3 + scroll", "scroll 2560 + edit + raw9"]') }}
    env:
      LUMINA_EDIT_GATE: "0"     # latency is reported, not gated, on a shared runner
      LUMINA_LONG: "1"          # the fuzz storms are long runs, started on purpose here
      LUMINA_PROBE_LIMIT: "1500"        # per probe.sh call; a shared runner is several times slower than a Mac on a desk
      LUMINA_SCENARIO_LIMIT: "900"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Tools/LuminaProbe/.build
          key: probe-${{ runner.os }}-${{ hashFiles('Tools/LuminaProbe/Package.swift', 'Tools/LuminaProbe/Sources/LuminaProbe/*.swift', 'Tools/LuminaProbe/Sources/LuminaProbe/*.js', 'Lumina/Sets/Core/*.swift', 'Lumina/Sets/Look/*.swift') }}
          restore-keys: probe-${{ runner.os }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: contains(matrix.shard, 'scroll')
        with:
          node-version: 20
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: contains(matrix.shard, 'scroll')
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}-chromium
      - name: a 775-photo synthetic card (scroll, Edit, RAW 9)
        if: contains(matrix.shard, 'scroll')
        run: |
          npm i -g playwright@1.56.1 && npx playwright install chromium
          NODE_PATH="$(npm root -g)" node Tests/web/make-shoot.mjs "${{ runner.temp }}/scroll-775/100MSDCF" 775
          echo "LUMINA_SCROLL_DIR=${{ runner.temp }}/scroll-775/100MSDCF" >> "$GITHUB_ENV"
          echo "LUMINA_EDIT_DIR=${{ runner.temp }}/scroll-775/100MSDCF" >> "$GITHUB_ENV"
      - name: ${{ matrix.shard }}
        shell: bash {0}       # no -e: every suite in the shard runs; the exit code combines them
        env:
          LUMINA_PROBE_OUT: ${{ runner.temp }}/probe
          SHARD: ${{ matrix.shard }}
        run: |
          s1=0; s2=0; s3=0
          case "$SHARD" in
            "smoke + screens")
              bash Scripts/probe.sh smoke; s1=$?; bash Scripts/probe.sh screens; s2=$?; bash Scripts/probe.sh sandbox smoke; s3=$? ;;
            "fuzz 1-2")
              bash Scripts/probe.sh scenarios fuzz-sample-1 fuzz-sample-2; s1=$? ;;
            "fuzz 3 + scroll")
              bash Scripts/probe.sh scenarios fuzz-sample-3 scroll-read scroll-fast; s1=$? ;;
            "scroll 2560 + edit + raw9")
              bash Scripts/probe.sh scenarios scroll-fast-2560; s1=$?; bash Scripts/probe.sh edit; s2=$?; bash Scripts/probe.sh raw9; s3=$? ;;
            *) echo "unknown shard: $SHARD"; exit 2 ;;
          esac
          exit $((s1 | s2 | s3))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/probe*/**/report.json
            ${{ runner.temp }}/probe*/**/*.png
            ${{ runner.temp }}/probe*/manifest.json
            ${{ runner.temp }}/probe*/**/read-end.json
            ${{ runner.temp }}/probe*/**/thumb.json
            ${{ runner.temp }}/probe*/**/canvas.json
            ${{ runner.temp }}/probe*/**/parity.json
            ${{ runner.temp }}/probe*/**/raw9.json
            ${{ runner.temp }}/probe*/**/canvas-after-loupe.json
            ${{ runner.temp }}/probe*/**/sandbox*.json
            ${{ runner.temp }}/probe*/**/sandbox-denials.log
            ${{ runner.temp }}/probe*/sandbox-results.tsv
          retention-days: 7

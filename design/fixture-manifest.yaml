# Fixture manifest version — pairs with design/fixture-manifest.md (D53, A1; E1 proposal).
version: "1.1-latency-cards"
contract: design/contract-v6.md
doc: design/fixture-manifest.md

# [◐ E1 — PROPOSED, NOT RATIFIED] Latency cards cut for E2 Gate 1.
# Cut root is a working directory, not committed.
cut_root: "~/Pictures/lumina-fixtures"
tooling:
  cut: Scripts/fixtures/cut_latency_card.py
  verify: Scripts/fixtures/verify_latency_card.py

# External, checksum-verified media. The archive is deliberately not committed:
# real RAW bodies are large and consent/license provenance travels with the
# private bundle. CI supplies URL + archive digest; every extracted file is
# verified again against checksums.sha256 inside the bundle.
raw_correctness_bundle:
  version: "raw-correctness-v1"
  status: external-required
  download_url_env: LUMINA_RAW_FIXTURE_BUNDLE_URL
  archive_sha256_env: LUMINA_RAW_FIXTURE_BUNDLE_SHA256
  root_env: LUMINA_RAW_FIXTURE_ROOT
  checksums: checksums.sha256
  verify: Scripts/fixtures/verify_raw_fixture_bundle.py
  tiers:
    hosted:
      purpose: pull-request correctness and broad latency ceilings
      minimum_photos: 8
      required_extensions: [.ARW, .CR3, .DNG]
    full:
      purpose: fixed-hardware nightly performance and format fidelity
      minimum_photos: 12
      required_extensions: [.ARW, .CR3, .NEF, .RAF, .DNG, .HEIC]

seed_bodies:
  sony-a7iii:
    status: proposed
    make: SONY
    model: ILCE-7M3
    extension: .ARW
    note: >-
      Body actually present on the maintainer's machine. The fleet table names
      sony-a7iv (A7 IV); these frames are A7 III. Recorded as the true seed
      rather than mislabelled.

latency_cards:
  card-clean-500:
    status: cut
    cut_date: "2026-08-20"
    frames: 500
    seed_body: sony-a7iii
    distinct_frames: 500
    replication_factor: 1.0
    clone_backed: false
    bytes_on_disk: 5519134720
    content_variety: full
    decode_cost: preserved
    cold_io_fidelity: faithful
    checksums: card-clean-500/checksums.sha256
  card-clean-2000:
    status: cut
    cut_date: "2026-08-20"
    frames: 2000
    seed_body: sony-a7iii
    distinct_frames: 1000
    replication_factor: 2.0
    clone_backed: true
    content_variety: partial
    decode_cost: preserved
    cold_io_fidelity: understated
    caveat: >-
      2000 files, 1000 distinct photographs. Decode cost per frame is real;
      cold-I/O pressure is understated because cloned repeats share physical
      blocks. Absolute numbers are optimistic and must not be quoted as SLA
      passes. Before/after comparison on the same fixture remains valid.
    checksums: card-clean-2000/checksums.sha256

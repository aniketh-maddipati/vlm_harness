name: Lumina

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  design:
    name: design handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lumina-core fixtures
        run: |
          source Scripts/page_files.sh
          cd design/handoff/lumina-cull && node "$CORE_TEST" | tee /tmp/fixtures.txt && ! grep -q '^FAIL' /tmp/fixtures.txt
      - name: app ships the design byte for byte
        run: |
          set -e
          source Scripts/page_files.sh
          for f in "${PAGE_FILES[@]}"; do
            cmp "design/handoff/lumina-cull/$f" "Lumina/Sets/Web/$f"
          done
          for f in design/handoff/vendor/*.js; do cmp "$f" "Lumina/Sets/Web/$(basename "$f")"; done
      - name: wording + demo-layer audit (report only)
        run: source Scripts/page_files.sh && python3 Tests/probe/design_audit.py "design/handoff/lumina-cull/$PAGE"

  plumbing:
    name: plumbing.js on the page (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: playwright
        run: npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: plumbing harness
        run: NODE_PATH="$(npm root -g)" node Tests/web/plumbing-harness.mjs

  webkit:
    name: page + plumbing in WebKit (WebKitGTK sandbox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: WebKitGTK, Xvfb, playwright (fixture JPEGs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gir1.2-webkit2-4.1 python3-gi python3-gi-cairo xvfb
          npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: contract, selftest, app flow, screens (prototype vs app)
        run: NODE_PATH="$(npm root -g)" xvfb-run -a -s "-screen 0 2000x1300x24" /usr/bin/python3 Tests/web/webkit.py

  swift-linux:
    name: native file code on Linux (Swift 6.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SetsSidecarTests, SetsTrustTests, SetsFileOpsTests
        run: bash Tests/linux-swift/run.sh

  app:
    name: build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: |
          xcodebuild -project Lumina.xcodeproj -scheme Lumina -configuration Debug \
            -derivedDataPath DD -destination 'platform=macOS,arch=arm64' \
            -only-testing:LuminaLogicTests test
      - name: probe builds
        run: swift build --package-path Tools/LuminaProbe

  probe:
    name: probe in WKWebView (no fixtures)
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: contract, selftest, smoke, fuzz
        env:
          LUMINA_PROBE_OUT: ${{ runner.temp }}/probe
        run: |
          status=0
          for s in contract selftest smoke fuzz; do echo "::group::probe $s"; bash Scripts/probe.sh $s || status=1; echo "::endgroup::"; done
          exit $status
      - name: screens, app vs design at 0 px (records a fresh reference, then compares)
        env:
          LUMINA_PROBE_OUT: ${{ runner.temp }}/probe-ref
        run: bash Scripts/probe.sh reference --record && LUMINA_PROBE_OUT="${{ runner.temp }}/probe-cmp" bash Scripts/probe.sh reference
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: scroll on a 775-photo synthetic card (read while culling, then fast scroll; real WKWebView + native reader)
        env:
          LUMINA_PROBE_OUT: ${{ runner.temp }}/probe-scroll
          LUMINA_SCROLL_DIR: ${{ runner.temp }}/scroll-775/100MSDCF
        run: |
          npm i -g playwright@1.56.1 && npx playwright install chromium
          NODE_PATH="$(npm root -g)" node Tests/web/make-shoot.mjs "$LUMINA_SCROLL_DIR" 775
          bash Scripts/probe.sh scroll
      - name: scroll on real Sony ARWs (public CC0 samples from raw.pixls.us, 408 copies in bursts)
        env:
          LUMINA_PROBE_OUT: ${{ runner.temp }}/probe-scroll-raw
          LUMINA_FIXTURE_ROOT: ${{ runner.temp }}/public-arws
        run: |
          brew list exiftool >/dev/null 2>&1 || brew install -q exiftool
          bash Tests/probe/fetch_public_arws.sh "$LUMINA_FIXTURE_ROOT" 12
          bash Scripts/probe.sh scroll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-evidence
          path: |
            ${{ runner.temp }}/probe*/**/report.json
            ${{ runner.temp }}/probe*/**/*.png
            ${{ runner.temp }}/probe*/manifest.json
            ${{ runner.temp }}/probe*/**/read-end.json
            ${{ runner.temp }}/probe*/**/thumb.json
          retention-days: 7

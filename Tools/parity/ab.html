<!doctype html>
<meta charset="utf-8">
<title>Blind A/B</title>
<style>
  body { font: 15px -apple-system, system-ui, sans-serif; margin: 0; background: #111; color: #ddd; }
  header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  textarea { width: 420px; height: 60px; background: #222; color: #ddd; border: 1px solid #444; }
  button { font: inherit; padding: 6px 14px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px; }
  main img { width: 100%; height: calc(100vh - 120px); object-fit: contain; background: #000; cursor: pointer; }
  footer { padding: 10px 16px; display: flex; gap: 16px; align-items: center; }
  .done { padding: 40px; text-align: center; }
</style>
<header>
  <label>Pairs (one &lt;stem&gt; per line; files &lt;stem&gt;.adobe.png and &lt;stem&gt;.lumina.png next to this page):
    <textarea id="stems"></textarea></label>
  <label>Rater <input id="rater" size="10"></label>
  <button id="start">Start</button>
</header>
<main id="main" hidden><img id="left"><img id="right"></main>
<footer id="foot" hidden>
  <span id="progress"></span>
  <span>Click the photo you prefer (or press ← / →). Keys 1 / 2 also work.</span>
</footer>
<div id="done" class="done" hidden></div>
<script>
  // No network, no framework. Order of pairs and left/right side are shuffled with a seeded RNG
  // per rater name, so a rater can't learn a side and a run can be repeated.
  let pairs = [], i = 0, rows = [], t0 = 0, rng;
  const seeded = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h += 0x6D2B79F5; let t = Math.imul(h ^ (h >>> 15), 1 | h); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const show = () => {
    if (i >= pairs.length) return finish();
    const p = pairs[i];
    document.getElementById('left').src = p.left === 'lumina' ? p.stem + '.lumina.png' : p.stem + '.adobe.png';
    document.getElementById('right').src = p.right === 'lumina' ? p.stem + '.lumina.png' : p.stem + '.adobe.png';
    document.getElementById('progress').textContent = (i + 1) + ' / ' + pairs.length;
    t0 = performance.now();
  };
  const choose = side => {
    const p = pairs[i];
    rows.push([p.stem, p.left, p.right, side === 'left' ? p.left : p.right, Math.round(performance.now() - t0)]);
    i++; show();
  };
  const finish = () => {
    document.getElementById('main').hidden = true; document.getElementById('foot').hidden = true;
    const wins = rows.filter(r => r[3] === 'lumina').length;
    const csv = 'stem,left,right,chosen,ms\n' + rows.map(r => r.join(',')).join('\n') + '\n';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'ab-' + (document.getElementById('rater').value || 'rater') + '.csv';
    a.textContent = 'Download CSV';
    const d = document.getElementById('done'); d.hidden = false;
    d.textContent = 'Done: ' + wins + ' / ' + rows.length + ' for B. ';
    d.appendChild(a);
  };
  document.getElementById('start').onclick = () => {
    const stems = document.getElementById('stems').value.split(/\s+/).filter(Boolean);
    if (!stems.length) return alert('list the stems first');
    rng = seeded(document.getElementById('rater').value || 'rater');
    pairs = stems.map(stem => { const luminaLeft = rng() < 0.5; return { stem, left: luminaLeft ? 'lumina' : 'adobe', right: luminaLeft ? 'adobe' : 'lumina' }; });
    for (let k = pairs.length - 1; k > 0; k--) { const j = Math.floor(rng() * (k + 1)); [pairs[k], pairs[j]] = [pairs[j], pairs[k]]; }
    i = 0; rows = [];
    document.getElementById('main').hidden = false; document.getElementById('foot').hidden = false; document.getElementById('done').hidden = true;
    show();
  };
  document.getElementById('left').onclick = () => choose('left');
  document.getElementById('right').onclick = () => choose('right');
  addEventListener('keydown', e => { if (document.getElementById('main').hidden) return; if (e.key === 'ArrowLeft' || e.key === '1') choose('left'); if (e.key === 'ArrowRight' || e.key === '2') choose('right'); });
</script>
